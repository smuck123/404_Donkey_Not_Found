services:
  zabbix-tools:
    build:
      context: ./apps/zabbix-tools
    restart: unless-stopped
    environment:
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_TOKEN: ${ZABBIX_TOKEN:-}
      ZABBIX_TRAFFIC_ITEM_KEY: ${ZABBIX_TRAFFIC_ITEM_KEY:-fortigate_summary.sh}
      FORTIGATE_ZABBIX_HOST: ${FORTIGATE_ZABBIX_HOST:-himabot}
      FORTIGATE_URL: ${FORTIGATE_URL:-}
      FORTIGATE_TOKEN: ${FORTIGATE_TOKEN:-}
      FORTIGATE_VDOM: ${FORTIGATE_VDOM:-root}
      FORTIGATE_VERIFY_SSL: ${FORTIGATE_VERIFY_SSL:-true}
      FORTIGATE_TRAFFIC_PATH: ${FORTIGATE_TRAFFIC_PATH:-/api/v2/monitor/firewall/session}
    ports:
      - "127.0.0.1:8889:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  zabbix-mcp:
    build:
      context: ./apps/zabbix-tools
    restart: unless-stopped
    environment:
      ZABBIX_TOOLS_URL: http://zabbix-tools:8000
      ZABBIX_TRAFFIC_ITEM_KEY: ${ZABBIX_TRAFFIC_ITEM_KEY:-fortigate_summary.sh}
      FORTIGATE_ZABBIX_HOST: ${FORTIGATE_ZABBIX_HOST:-himabot}
    depends_on:
      zabbix-tools:
        condition: service_healthy
    command:
      - python
      - -m
      - app.mcp_server
    ports:
      - "127.0.0.1:8890:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8001), 3); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openclaw-gateway:
    profiles:
      - openclaw
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.7.1}
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama-local}
      TZ: ${TZ:-Europe/Helsinki}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ./config/openclaw/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - loopback
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - dist/docker-healthcheck.js
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    profiles:
      - openclaw
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.7.1}
    network_mode: host
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama-local}
      BROWSER: echo
      TZ: ${TZ:-Europe/Helsinki}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ./config/openclaw/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - node
      - dist/index.js

volumes:
  openclaw-state:
