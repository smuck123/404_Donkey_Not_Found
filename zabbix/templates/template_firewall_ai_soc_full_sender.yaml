zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 6f3d2c1b9a8e4a7b8c9d0e1f2a3b4c5d
      name: Templates/Custom
  templates:
    - uuid: 7a3c9d1e5b2f4a8c9e1d3b6f2a7c4d11
      template: 'Firewall AI SOC Full Sender'
      name: 'Firewall AI SOC Full Sender'
      description: |
        Receives enriched FortiGate SOC data through Zabbix trapper items.

        This template is for the syslog analysis pipeline. It is intentionally
        separate from Template FortiGate API Summary by Trapper, which contains
        read-only configuration and health data collected directly from FortiGate.

        The sender must use the exact Zabbix host name linked to this template.
        JSON payload items use the native JSON value type. The two counters use
        Numeric (unsigned). Sender access is limited to localhost by default.
      groups:
        - name: Templates/Custom
      macros:
        - macro: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          value: '127.0.0.1,::1'
          description: 'Comma-separated IP addresses or DNS names allowed to submit FortiGate trapper values.'
      items:
        - uuid: ad3f6a4b8c5e4a9f8b2d7e3a5c6d7e14
          name: 'Firewall AI actions JSON'
          type: TRAP
          key: fortigate.actions
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: 'Proposed or completed SOC actions generated by the FortiGate log analysis pipeline.'
          tags:
            - tag: component
              value: security
            - tag: data_source
              value: fortigate_syslog
        - uuid: b1a7ab8c3d9f4a8f9c6e2f7b9d1e2f21
          name: 'Firewall AI anomalies JSON'
          type: TRAP
          key: fortigate.anomalies
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: 'Anomalies detected in the collected FortiGate traffic events.'
          tags:
            - tag: component
              value: security
            - tag: data_source
              value: fortigate_syslog
        - uuid: d6c36d4e8f5b4a8b9e2a7b3d5f6a7b1d
          name: 'Firewall AI denied port heatmap JSON'
          type: TRAP
          key: fortigate.denied_port_heatmap
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: 'Denied connection counts grouped by destination port for heatmap and ranking views.'
          tags:
            - tag: component
              value: security
            - tag: data_source
              value: fortigate_syslog
        - uuid: b4a14b2c6d3f4a8f9c9e5f1b3d4e5f1b
          name: 'Firewall AI distributed scan targets JSON'
          type: TRAP
          key: fortigate.distributed_scan_targets
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: 'Internal targets contacted by multiple suspected scanners.'
          tags:
            - tag: component
              value: security
            - tag: data_source
              value: fortigate_syslog
        - uuid: f8e58f6a1b7d4a8d9a4c9d5f7b8c9d1f
          name: 'Firewall AI expected vs unexpected JSON'
          type: TRAP
          key: fortigate.expected_vs_unexpected
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: 'Traffic classification comparing expected activity with unusual or unexpected activity.'
          tags:
            - tag: component
              value: security
            - tag: data_source
              value: fortigate_syslog
        - uuid: cf5b8c6d1e7a4b9a8d4f9a5c7e8f9a16
          name: 'Firewall AI grouped destination names JSON'
          type: TRAP
          key: fortigate.grouped_destination_names
          history: 31d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
