              expression: 'nodata(/Firewall AI SOC Full Sender/fortigate.total_events,15m)=1'
              name: 'No FortiGate SOC sender data for 15 minutes'
              priority: WARNING
              description: 'The FortiGate SOC sender has not updated the total event count for 15 minutes.'
        - uuid: a17c904b236a4c349a9a8214a0f74002
          name: 'FortiGate API: Raw summary JSON'
          type: TRAP
          key: fortigate.api.raw
          history: 30d
          value_type: JSON
          allowed_hosts: '{$FORTIGATE.SENDER.ALLOWED_HOSTS}'
          description: |
            Master JSON payload sent by send_fortigate_api_summary.sh.
            The payload contains no API token or configuration secrets.
          tags:
            - tag: class
              value: firewall
            - tag: component
              value: raw
            - tag: source
              value: fortigate-api
        - uuid: a17c904b236a4c349a9a8214a0f74003
          name: 'FortiGate API: Collection status'
          type: DEPENDENT
          key: fortigate.api.collection_status
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection_status
              error_handler: CUSTOM_VALUE
              error_handler_params: failed
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: a17c904b236a4c349a9a8214a0f74101
              expression: 'nodata(/Firewall AI SOC Full Sender/fortigate.api.collection_status,15m)=1'
