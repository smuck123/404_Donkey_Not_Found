              parameters:
                - $.interfaces.down_names
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: network
        - uuid: a17c904b236a4c349a9a8214a0f7400e
          name: 'FortiGate API: Firewall policies total'
          type: DEPENDENT
          key: fortigate.api.policies.total
          value_type: UNSIGNED
          preprocessing:
