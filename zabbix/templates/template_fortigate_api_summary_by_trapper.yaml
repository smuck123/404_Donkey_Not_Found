          triggers:
            - uuid: a17c904b236a4c349a9a8214a0f74104
              expression: 'min(/Template FortiGate API Summary by Trapper/fortigate.api.performance.cpu,10m)>90'
              name: 'FortiGate CPU utilization is above 90%'
