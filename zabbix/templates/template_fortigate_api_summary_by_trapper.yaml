zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 6f3d2c1b9a8e4a7b8c9d0e1f2a3b4c5d
      name: Templates/Custom
  templates:
    - uuid: a17c904b236a4c349a9a8214a0f74001
      template: 'Template FortiGate API Summary by Trapper'
      name: 'Template FortiGate API Summary by Trapper'
      description: |
        Read-only FortiGate device and performance monitoring.

        The companion fortigate_api_summary.py collector runs on the Zabbix
        server and sends one JSON value to fortigate.api.raw. Dependent items
        extract current health and inventory values.

        This template is intentionally separate from the Firewall AI SOC
        syslog-flow template. It does not create or modify FortiGate
        configuration.
      groups:
        - name: Templates/Custom
      items:
        - uuid: a17c904b236a4c349a9a8214a0f74002
          name: 'FortiGate API: Raw summary JSON'
          type: TRAP
          key: fortigate.api.raw
          history: 30d
          value_type: JSON
          allowed_hosts: '127.0.0.1,::1'
          description: |
            Master JSON payload sent by send_fortigate_api_summary.sh.
            The payload contains no API token or configuration secrets.
          tags:
            - tag: class
              value: firewall
            - tag: component
              value: raw
            - tag: source
              value: fortigate-api
        - uuid: a17c904b236a4c349a9a8214a0f74003
          name: 'FortiGate API: Collection status'
          type: DEPENDENT
          key: fortigate.api.collection_status
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection_status
              error_handler: CUSTOM_VALUE
              error_handler_params: failed
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: a17c904b236a4c349a9a8214a0f74101
              expression: 'nodata(/Template FortiGate API Summary by Trapper/fortigate.api.collection_status,15m)=1'
              name: 'FortiGate API summary has no data for 15 minutes'
              priority: WARNING
              description: 'The Zabbix-server collector has not delivered a summary recently.'
            - uuid: a17c904b236a4c349a9a8214a0f74102
              expression: 'last(/Template FortiGate API Summary by Trapper/fortigate.api.collection_status)<>"ok"'
              name: 'FortiGate API summary collection is not healthy'
              priority: WARNING
        - uuid: a17c904b236a4c349a9a8214a0f74004
          name: 'FortiGate API: Generated at'
          type: DEPENDENT
          key: fortigate.api.generated_at
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.generated_at
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: collector
        - uuid: a17c904b236a4c349a9a8214a0f74005
          name: 'FortiGate API: Device hostname'
          type: DEPENDENT
          key: fortigate.api.device.hostname
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device.hostname
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: system
        - uuid: a17c904b236a4c349a9a8214a0f74006
          name: 'FortiGate API: Device model'
          type: DEPENDENT
          key: fortigate.api.device.model
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device.model
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: system
        - uuid: a17c904b236a4c349a9a8214a0f74007
          name: 'FortiGate API: Serial number'
          type: DEPENDENT
          key: fortigate.api.device.serial
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device.serial
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: system
        - uuid: a17c904b236a4c349a9a8214a0f74008
          name: 'FortiGate API: FortiOS version'
          type: DEPENDENT
          key: fortigate.api.device.version
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device.version
          master_item:
            key: fortigate.api.raw
          tags:
            - tag: component
              value: system
        - uuid: a17c904b236a4c349a9a8214a0f74009
          name: 'FortiGate API: FortiOS build'
          type: DEPENDENT
          key: fortigate.api.device.build
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device.build
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
