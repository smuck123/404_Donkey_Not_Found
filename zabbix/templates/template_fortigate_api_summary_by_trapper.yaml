        - uuid: a17c904b236a4c349a9a8214a0f7400a
          name: 'FortiGate API: Interfaces total'
          type: DEPENDENT
          key: fortigate.api.interfaces.total
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
