zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 6f3d2c1b9a8e4a7b8c9d0e1f2a3b4c5d
      name: Templates/Custom
  templates:
    - uuid: f36c4782bb104e9587ed012dc55dad3b
      template: 'Template Log Summary by Trapper'
      name: 'Template Log Summary by Trapper'
      description: |
        Receives structured Linux log events and periodic AI-assisted log summaries
        through local Zabbix trapper items. The real-time forwarder and five-minute
        summary collector are independent and may be enabled separately.

        Security: restrict {$TRAPPER.ALLOWED_HOSTS} to the collector source addresses.
        Never expose trapper items to 0.0.0.0/0 or ::/0.
      vendor:
        name: 404-Donkey_not_found
        version: 8.0-1
      readme: |
        ## Data paths

        - linux.log.json receives individual JSON events from zabbix_log_forwarder.py.
        - log.summary.raw receives donkey_log_summary_v2 JSON from log_summary.py.
        - log.summary.text receives the concise human-readable summary.

        The summary collector normally runs every five minutes. Attach this template
        to the exact technical host name used by zabbix_sender.
      groups:
        - name: Templates/Custom
      macros:
        - macro: '{$TRAPPER.ALLOWED_HOSTS}'
          value: '127.0.0.1,::1'
          description: 'Comma-separated IP addresses allowed to submit trapper values.'
      items:
        - uuid: b1d1c0aa25984a98b576c03ab69d940e
          name: 'Log summary linux'
          type: TRAP
          key: linux.log.json
          history: 7d
          value_type: JSON
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          description: 'Individual structured Linux log events sent by the real-time zabbix_log_forwarder.py service.'
          tags:
            - tag: component
              value: logs
        - uuid: 4fe56ff97985452bb162ccfab7aeeffa
          name: Messages_log_raw
          type: TRAP
          key: log.messages.json
          value_type: JSON
          status: DISABLED
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          description: 'Deprecated compatibility item. Keep disabled unless an older sender still uses this key.'
        - uuid: b18bad74ae324afba37a909abc35ad88
          name: 'Log AI summary'
          type: DEPENDENT
          key: log.summary.ai_summary
          description: 'Concise Ollama-generated explanation. Uses the deterministic summary when Ollama is unavailable.'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ai_summary
          master_item:
            key: log.summary.raw
          tags:
            - tag: component
              value: logs
        - uuid: 84c810a1a5fe4bf89a24f7a8b707a672
          name: 'Security attack type'
          type: DEPENDENT
          key: log.summary.attack_type
          description: 'Detected attack classification, or none when no supported attack pattern is present.'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.attack_type
          master_item:
            key: log.summary.raw
          tags:
            - tag: component
              value: security
        - uuid: 1793b93507294e7cb09d5cdef7b0897a
          name: 'Audit anomaly'
          type: DEPENDENT
          key: log.summary.audit_anom
          description: 'Number of Linux Audit ANOM events during the current collection interval.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.counts_flat.audit_anom
          master_item:
            key: log.summary.raw
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 1b971205b13a44a0918208bd197153d5
              expression: 'last(/Template Log Summary by Trapper/log.summary.audit_anom)>0'
              name: 'Audit anomaly on {HOST.NAME}'
              priority: HIGH
        - uuid: d335316a205148cd95e6e1c9b8482e8c
          name: 'Audit AVC denied'
          type: DEPENDENT
          key: log.summary.audit_avc_denied
          description: 'Number of SELinux AVC denied events during the current collection interval.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.counts_flat.audit_avc_denied
          master_item:
