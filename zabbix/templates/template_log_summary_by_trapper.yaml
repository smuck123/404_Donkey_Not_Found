          tags:
            - tag: component
              value: security
        - uuid: d7b10c31177446ec992d3032200582fb
          name: 'Security breach suspected'
          type: DEPENDENT
          key: log.summary.breach_suspected
          description: 'Numeric breach indicator: 1 means suspected and 0 means not suspected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.breach_suspected
          master_item:
            key: log.summary.raw
